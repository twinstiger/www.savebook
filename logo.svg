<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35"/>
      <stop offset="50%" style="stop-color:#F7931E"/>
      <stop offset="100%" style="stop-color:#FFD166"/>
    </linearGradient>
    
    <linearGradient id="controllerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ECDC4"/>
      <stop offset="50%" style="stop-color:#556270"/>
      <stop offset="100%" style="stop-color:#2C3E50"/>
    </linearGradient>
    
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E94560"/>
      <stop offset="100%" style="stop-color:#FF6B6B"/>
    </linearGradient>
    
    <linearGradient id="textGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4ECDC4"/>
      <stop offset="100%" style="stop-color:#556270"/>
    </linearGradient>
    <linearGradient id="textGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B35"/>
      <stop offset="100%" style="stop-color:#F7931E"/>
    </linearGradient>
    
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000033"/>
    </filter>
  </defs>
  
  <circle cx="90" cy="100" r="75" fill="none" stroke="#E8F4F8" stroke-width="2"/>
  
  
  <g filter="url(#shadow)" transform="translate(10, 20)">
    <!-- 左页 -->
    <path d="M80,80 L80,160 Q60,155 40,158 L40,78 Q60,75 80,80 Z" fill="#E94560" opacity="0.9"/>
    <path d="M80,80 L80,155 Q70,152 60,155 L60,78 Q70,75 80,80 Z" fill="#FF6B6B"/>
    
    <!-- 右页 -->
    <path d="M80,80 L80,160 Q100,155 120,158 L120,78 Q100,75 80,80 Z" fill="url(#bookGrad)"/>
    <path d="M80,80 L80,155 Q90,152 100,155 L100,78 Q90,75 80,80 Z" fill="#FFB347"/>
    
    <!-- 书脊 -->
    <line x1="80" y1="75" x2="80" y2="163" stroke="#2C3E50" stroke-width="3"/>
    
    <!-- 书签带 -->
    <path d="M95,80 L95,50 L100,58 L105,50 L105,80" fill="#E94560" opacity="0.8"/>
  </g>
  
  <g filter="url(#shadow)" transform="translate(120, 15)">
    <!-- 手柄主体 -->
    <rect x="60" y="70" rx="20" ry="20" width="80" height="50" fill="url(#controllerGrad)"/>
    
    <ellipse cx="65" cy="95" rx="15" ry="25" fill="#4ECDC4"/>
    <ellipse cx="65" cy="95" rx="10" ry="18" fill="#6DD5C9"/>
    
    <ellipse cx="135" cy="95" rx="15" ry="25" fill="#4ECDC4"/>
    <ellipse cx="135" cy="95" rx="10" ry="18" fill="#6DD5C9"/>
    
    <rect x="75" y="80" rx="2" ry="2" width="6" height="30" fill="#2C3E50"/>
    <rect x="63" y="85" rx="2" ry="2" width="30" height="6" fill="#2C3E50"/>
    
    <circle cx="115" cy="82" r="6" fill="url(#btnGrad)"/>
    <circle cx="130" cy="92" r="6" fill="#00D2FF"/>
    <circle cx="115" cy="102" r="6" fill="#4ECDC4"/>
    <circle cx="100" cy="92" r="6" fill="#FFD166"/>
    
    <rect x="88" y="92" rx="2" ry="2" width="5" height="5" fill="#556270"/>
    <rect x="107" y="92" rx="2" ry="2" width="5" height="5" fill="#556270"/>
  </g>
  
  <g transform="translate(55, 150)">
    <rect x="0" y="0" rx="3" ry="3" width="18" height="18" fill="#FFD166" stroke="#F7931E" stroke-width="1.5"/>
    <rect x="4" y="2" rx="1" ry="1" width="6" height="5" fill="#F7931E"/>
    <rect x="12" y="8" rx="1" ry="1" width="4" height="8" fill="#F7931E"/>
    <!-- 星星 -->
    <polygon points="22,2 24,7 29,7 25,11 27,16 22,13 17,16 19,11 15,7 20,7" fill="#FFD166" opacity="0.8"/>
  </g>
  
  
  <!-- Save -->
  <text x="220" y="115" font-family="'Arial Black', 'Impact', 'Segoe UI Black', sans-serif" font-size="64" font-weight="900" fill="url(#textGrad1)" letter-spacing="2">
    Save
  </text>
  
  <text x="370" y="115" font-family="'Arial Black', 'Impact', 'Segoe UI Black', sans-serif" font-size="64" font-weight="900" fill="url(#textGrad2)" letter-spacing="2">
    Book
  </text>
  
  <text x="220" y="155" font-family="'Segoe UI', 'Arial', sans-serif" font-size="18" fill="#556270" letter-spacing="4" font-weight="300">
    YOUR GAME GUIDE HUB
  </text>
  
  <line x1="220" y1="168" x2="550" y2="168" stroke="url(#bookGrad)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- 彩色圆点装饰 -->
  <circle cx="210" cy="175" r="4" fill="#E94560"/>
  <circle cx="225" cy="175" r="4" fill="#4ECDC4"/>
  <circle cx="240" cy="175" r="4" fill="#FFD166"/>
  <circle cx="255" cy="175" r="4" fill="#F7931E"/>
  
</svg>